<section class="hero">
  <div class="hero-content">
    <p class="eyebrow">MeninosEuVi</p>
    <h1>Histórias que viram som</h1>
    <p class="lead">Um lugar para ouvir e ver narrativas em imagens.</p>
    <div class="actions">
      <a class="btn primary" routerLink="/media">Ver midias</a>
      <a class="btn ghost" routerLink="/bio">Conhecer a bio</a>
    </div>
  </div>
  <div class="hero-card">
    <ng-container *ngIf="selection$ | async as item; else emptySelection">
      <div class="card-media">
        <img [src]="item.imageUrl" [alt]="item.title" />
      </div>
      <div class="card-copy">
        <h3>Seleção do dia</h3>
        <p class="title">{{ item.title }}</p>
        <span class="date" *ngIf="item.createdAt">{{ item.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        <audio controls [src]="audioSrc(item)"></audio>
      </div>
    </ng-container>
    <ng-template #emptySelection>
      <div class="card-media placeholder"></div>
      <div class="card-copy">
        <h3>Selecao do dia</h3>
        <p>Imagens com audio integrado para uma experiencia completa.</p>
      </div>
    </ng-template>
  </div>
</section>
